[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crontab-next"
version = "0.3.0"
description = "Show when a cron expression will fire next"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Maria Okafor", email = "maria@okafor.dev"}]
requires-python = ">=3.10"
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
crontab-next = "crontab_next.cli:main"

[tool.setuptools]
packages = ["crontab_next"]
